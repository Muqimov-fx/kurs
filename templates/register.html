{% extends 'base.html' %}

{% block title %}Ro'yxatdan o'tish - Universal ERI{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card glass animate-fade-in">
        <h2 style="text-align: center; margin-bottom: 2rem;">Ro'yxatdan o'tish</h2>
        <form action="/register" method="POST">
            <div class="form-group">
                <label for="name">To'liq Ismingiz</label>
                <input type="text" id="name" name="name" class="form-input" placeholder="Ism Familiya" required>
            </div>
            <div class="form-group">
                <label for="email">Email yoki Telefon</label>
                <input type="text" id="email" name="email" class="form-input" placeholder="user@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Parol</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="********" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">Parolni Tasdiqlash</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-input"
                    placeholder="********" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Ro'yxatdan o'tish</button>
        </form>
        <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">
            Akkauntingiz bormi? <a href="/login" style="color: var(--primary-color);">Kirish</a>
        </p>
    </div>
</div>
{% endblock %}
