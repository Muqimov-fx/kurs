{% extends 'base.html' %}

{% block title %}Kirish - Universal ERI{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card glass animate-fade-in">
        <h2 style="text-align: center; margin-bottom: 2rem;">Tizimga Kirish</h2>
        <form action="/login" method="POST">
            <div class="form-group">
                <label for="email">Email yoki Telefon</label>
                <input type="text" id="email" name="email" class="form-input" placeholder="user@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Parol</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="********" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Kirish</button>
        </form>
        <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">
            Hisobingiz yo'qmi? <a href="/register" style="color: var(--primary-color);">Ro'yxatdan o'tish</a>
        </p>
    </div>
</div>
{% endblock %}
