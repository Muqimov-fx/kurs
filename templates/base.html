<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Universal ERI{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons (using CDN for simplicity) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <nav class="navbar glass container">
        <a href="/" class="logo"><i class="fas fa-fingerprint"></i> Universal ERI</a>
        <div class="nav-links">
            {% if request.endpoint != 'login' %}
            <a href="/about" class="btn btn-outline" style="margin-right: 10px;">Dastur Haqida</a>
            <a href="/" class="btn btn-outline" style="margin-right: 10px;">Bosh Sahifa</a>
            <a href="/logout" class="btn btn-outline">Chiqish</a>
            {% endif %}
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
